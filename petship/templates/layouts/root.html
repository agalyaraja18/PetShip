<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>{% block title %}{{ APP_NAME }}{% endblock %}</title>

  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/shells.css') }}">
  {% block head_extra %}{% endblock %}

  <script defer src="{{ url_for('static', filename='js/vendor/htmx.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/vendor/alpine.min.js') }}"></script>
  <script defer src="{{ url_for('static', filename='js/app.js') }}"></script>
</head>
<body class="{% block body_class %}{% endblock %}">
  <a href="#main-content" class="skip-link">Skip to content</a>
  {% block body %}{% endblock %}
  {% block scripts %}{% endblock %}
</body>
</html>
