{% extends 'layouts/public.html' %}
{% block title %}Feedback · {{ APP_NAME }}{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Share your feedback</h1>
  <p class="text-muted">Rate your PetShip experience and help us make the platform better.</p>
</div>
<div class="card" style="max-width: 720px; margin: 0 auto;">
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="field">
      <label for="feedback-name">Name</label>
      <input id="feedback-name" class="input" name="name" maxlength="160" value="{{ name }}" required>
    </div>
    <fieldset class="field">
      <legend>Star rating</legend>
      <div class="row row-wrap" role="radiogroup" aria-label="Star rating">
        {% for value in range(1, 6) %}
          <label class="row" style="gap: .35rem;">
            <input type="radio" name="rating" value="{{ value }}" required>
            <span class="text-primary" aria-hidden="true">{{ '★' * value }}</span>
            <span>{{ value }} {{ 'star' if value == 1 else 'stars' }}</span>
          </label>
        {% endfor %}
      </div>
    </fieldset>
    <div class="field">
      <label for="feedback-body">Feedback</label>
      <textarea id="feedback-body" class="textarea" name="body" maxlength="2000" rows="6" required></textarea>
    </div>
    <button class="btn btn-primary" type="submit">Submit feedback</button>
  </form>
</div>
{% endblock %}
